<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web脆弱性診断 模擬試験 | SecuriST 対策トレーナー</title>
<style>
  :root{
    --bg:#0a111e; --bg2:#0c1424;
    --surface:#111c30; --surface2:#152339; --raise:#19294224;
    --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
    --text:#e8eef7; --muted:#93a4bd; --faint:#65778f;
    --primary:#3fc7dc; --primary-ink:#062430;
    --flag:#f6c453; --flag-dim:#f6c45322;
    --ok:#41d39a; --ok-dim:#41d39a1f; --ok-bd:#41d39a66;
    --bad:#fb7185; --bad-dim:#fb71851c; --bad-bd:#fb718566;
    --code-bg:#0a1320; --code-bd:#ffffff14; --code-ink:#bfe7ef;
    --shadow:0 18px 50px -22px rgba(0,0,0,.85);
    --r:14px; --r-sm:10px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  }
  [data-theme="light"]{
    --bg:#eef1f5; --bg2:#e8ecf2;
    --surface:#ffffff; --surface2:#f4f6f9; --raise:#0b1c3208;
    --border:rgba(12,26,48,.12); --border-strong:rgba(12,26,48,.2);
    --text:#142031; --muted:#56657c; --faint:#8493a8;
    --primary:#0d8da3; --primary-ink:#ffffff;
    --flag:#b9791f; --flag-dim:#b9791f18;
    --ok:#0f9d6b; --ok-dim:#0f9d6b14; --ok-bd:#0f9d6b55;
    --bad:#d6455d; --bad-dim:#d6455d12; --bad-bd:#d6455d55;
    --code-bg:#0e1a2b; --code-bd:#ffffff10; --code-ink:#cfeaf0;
    --shadow:0 16px 40px -24px rgba(20,32,49,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 78% -8%, color-mix(in srgb,var(--primary) 13%, transparent), transparent 60%),
      radial-gradient(700px 460px at -6% 4%, color-mix(in srgb,var(--flag) 9%, transparent), transparent 55%),
      var(--bg);
    color:var(--text); font-family:var(--sans); line-height:1.7;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  .wrap{max-width:780px;margin:0 auto;padding:0 18px 72px}
  a{color:var(--primary)}
  code,.mono{font-family:var(--mono)}

  /* header */
  header.top{position:sticky;top:0;z-index:30;
    background:color-mix(in srgb,var(--bg) 82%, transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .top-in{max-width:780px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:30px;height:30px;border-radius:8px;flex:none;position:relative;
    background:linear-gradient(150deg,var(--primary),color-mix(in srgb,var(--primary) 40%, var(--flag)));
    box-shadow:0 0 0 1px var(--border-strong), 0 6px 16px -6px color-mix(in srgb,var(--primary) 60%, transparent)}
  .logo::after{content:">_";position:absolute;inset:0;display:grid;place-items:center;
    font-family:var(--mono);font-weight:700;font-size:12px;color:var(--primary-ink)}
  .brand b{font-size:14.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand span{display:block;font-size:10.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.4px}
  .spacer{flex:1}
  .mode-tag{font-family:var(--mono);font-size:11px;color:var(--flag);border:1px solid var(--flag);
    padding:3px 9px;border-radius:999px;background:var(--flag-dim);white-space:nowrap}
  .icon-btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);
    color:var(--text);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1;
    display:grid;place-items:center;transition:.15s}
  .icon-btn:hover{border-color:var(--primary);color:var(--primary)}

  /* scan progress bar */
  .scan{height:3px;background:transparent;position:sticky;top:53px;z-index:29}
  .scan i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--flag));
    transition:width .35s cubic-bezier(.4,0,.2,1)}

  /* generic */
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--flag)}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .muted{color:var(--muted)}
  .btn{appearance:none;cursor:pointer;font-family:var(--sans);font-size:15px;font-weight:600;
    border-radius:11px;padding:13px 18px;border:1px solid var(--border-strong);background:var(--surface2);
    color:var(--text);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{border-color:var(--primary)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 92%,#fff),var(--primary));
    color:var(--primary-ink);border:none;box-shadow:0 10px 22px -12px color-mix(in srgb,var(--primary) 80%, transparent)}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:transparent}

  /* ---------- START ---------- */
  .hero{padding:38px 4px 8px}
  .hero h1{font-size:clamp(26px,6vw,38px);line-height:1.18;margin:12px 0 10px;letter-spacing:-.4px;font-weight:800}
  .hero h1 em{font-style:normal;color:var(--primary)}
  .hero p.lead{color:var(--muted);font-size:15px;margin:0 0 4px;max-width:54ch}
  .req-strip{margin:22px 0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--code-bg)}
  .req-line{font-family:var(--mono);font-size:12.5px;padding:11px 14px;color:var(--code-ink);
    display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--code-bd);flex-wrap:wrap}
  .req-line:last-child{border-bottom:none}
  .verb{color:var(--flag);font-weight:700}
  .req-meta{color:#7fa6b3}
  .setup{margin-top:8px}
  .setup h2{font-size:13px;letter-spacing:.3px;margin:26px 0 12px;color:var(--text);
    display:flex;align-items:center;gap:9px}
  .setup h2::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--flag);transform:rotate(45deg)}
  .opt-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.opt-cards{grid-template-columns:1fr}}
  .pick{cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);
    padding:15px 16px;transition:.15s;position:relative}
  .pick:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  .pick.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 9%, var(--surface))}
  .pick .pk-t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .pick .pk-d{font-size:12.5px;color:var(--muted);margin-top:4px}
  .pick .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--faint);flex:none}
  .pick.sel .dot{border-color:var(--primary);background:
    radial-gradient(circle,var(--primary) 0 4px, transparent 5px)}
  .toggle-row{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .switch{display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:var(--surface);
    border-radius:var(--r-sm);padding:12px 14px;cursor:pointer;user-select:none}
  .switch:hover{border-color:var(--border-strong)}
  .sw{width:40px;height:23px;border-radius:999px;background:var(--surface2);border:1px solid var(--border-strong);
    position:relative;flex:none;transition:.18s}
  .sw::after{content:"";position:absolute;top:1.5px;left:2px;width:18px;height:18px;border-radius:50%;
    background:var(--faint);transition:.18s}
  .switch.on .sw{background:color-mix(in srgb,var(--primary) 30%, var(--surface));border-color:var(--primary)}
  .switch.on .sw::after{transform:translateX(16px);background:var(--primary)}
  .switch .lab{font-size:14px;font-weight:600}
  .switch .lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .start-cta{margin-top:26px}
  .start-cta .btn-primary{width:100%;padding:16px;font-size:16px}

  /* ---------- QUIZ ---------- */
  .qcount{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .qcount b{color:var(--text);font-size:13px}
  .qtimer{color:var(--faint)}
  .card{padding:0;overflow:hidden;margin-bottom:14px}
  .qhead{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--code-bg);
    border-bottom:1px solid var(--code-bd);flex-wrap:wrap}
  .qid{font-family:var(--mono);font-size:12px;color:var(--primary);font-weight:700;letter-spacing:.5px}
  .qtopic{font-family:var(--mono);font-size:12px;color:#86a7b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap;font-family:var(--mono)}
  .chip.neg{color:var(--flag);background:var(--flag-dim);border:1px solid var(--flag)}
  .chip.pos{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%, transparent);border:1px solid var(--primary)}
  .qbody{padding:18px 16px 6px}
  .qtext{font-size:16.5px;font-weight:600;line-height:1.6;margin:0 0 16px}
  .answers{display:flex;flex-direction:column;gap:9px;padding:0 16px 18px}
  .ans{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;
    border:1px solid var(--border);background:var(--surface2);border-radius:var(--r-sm);
    padding:13px 14px;color:var(--text);font-size:14.5px;line-height:1.55;transition:.13s;font-family:var(--sans)}
  .ans:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  .ans .lt{font-family:var(--mono);font-weight:700;font-size:13px;width:24px;height:24px;border-radius:7px;
    display:grid;place-items:center;flex:none;background:var(--surface);border:1px solid var(--border-strong);color:var(--muted);transition:.13s}
  .ans.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%, var(--surface))}
  .ans.sel .lt{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
  .ans.correct{border-color:var(--ok-bd);background:var(--ok-dim)}
  .ans.correct .lt{background:var(--ok);color:#04231a;border-color:var(--ok)}
  .ans.wrong{border-color:var(--bad-bd);background:var(--bad-dim)}
  .ans.wrong .lt{background:var(--bad);color:#2a0710;border-color:var(--bad)}
  .ans.locked{cursor:default}
  .ans.locked:hover{transform:none}
  .ans .verdict{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;align-self:center;padding-left:8px}
  .ans.correct .verdict{color:var(--ok)} .ans.wrong .verdict{color:var(--bad)}
  code{background:var(--code-bg);border:1px solid var(--code-bd);color:var(--code-ink);
    border-radius:6px;padding:1px 6px;font-size:.9em;word-break:break-word}

  /* explanation block (study + result) */
  .exp{border-top:1px dashed var(--border-strong);margin-top:2px;padding:16px;background:var(--raise);animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .exp .verline{font-family:var(--mono);font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .exp .verline.ok{color:var(--ok)} .exp .verline.bad{color:var(--bad)}
  .exp h4{font-size:12px;letter-spacing:.4px;color:var(--flag);margin:16px 0 6px;font-family:var(--mono);text-transform:uppercase}
  .exp h4:first-of-type{margin-top:6px}
  .exp p{margin:0 0 4px;font-size:14px;color:var(--text)}
  .exp .why{font-size:13.5px;color:var(--muted);margin:5px 0;padding-left:14px;position:relative}
  .exp .why::before{content:attr(data-l);position:absolute;left:0;font-family:var(--mono);font-weight:700;color:var(--bad)}
  .meta-grid{display:grid;grid-template-columns:1fr;gap:0;margin-top:6px}
  .terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .term{font-family:var(--mono);font-size:11.5px;background:var(--surface2);border:1px solid var(--border);
    border-radius:6px;padding:3px 8px;color:var(--muted)}
  .review{font-size:13.5px;color:var(--text);background:var(--flag-dim);border-left:3px solid var(--flag);
    border-radius:0 8px 8px 0;padding:10px 12px;margin-top:8px}

  /* palette + nav */
  .palette{display:flex;flex-wrap:wrap;gap:7px;margin:18px 2px}
  .pdot{width:34px;height:34px;border-radius:9px;font-family:var(--mono);font-size:13px;font-weight:700;
    border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:.13s}
  .pdot:hover{border-color:var(--primary)}
  .pdot.answered{color:var(--text);border-color:var(--border-strong);background:var(--surface2)}
  .pdot.current{outline:2px solid var(--primary);outline-offset:1px;color:var(--primary)}
  .pdot.pcorrect{border-color:var(--ok-bd);color:var(--ok);background:var(--ok-dim)}
  .pdot.pwrong{border-color:var(--bad-bd);color:var(--bad);background:var(--bad-dim)}
  .navbar{display:flex;gap:10px;align-items:center;margin-top:6px}
  .navbar .btn{flex:1}
  .submit-wrap{margin-top:14px}
  .submit-wrap .btn-primary{width:100%}
  .unanswered{font-family:var(--mono);font-size:12px;color:var(--flag);text-align:center;margin-top:9px}
  .hint-pick{font-size:13px;color:var(--faint);text-align:center;padding:6px}

  /* ---------- RESULT ---------- */
  .res-hero{padding:26px;display:flex;gap:22px;align-items:center;margin:22px 0 16px}
  @media(max-width:520px){.res-hero{flex-direction:column;text-align:center;gap:16px}}
  .ring{flex:none;position:relative;width:128px;height:128px}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring .pct b{font-size:30px;font-weight:800;line-height:1}
  .ring .pct small{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:1px}
  .res-meta h2{margin:0 0 4px;font-size:13px;font-family:var(--mono);letter-spacing:1px;color:var(--flag);text-transform:uppercase}
  .res-meta .score{font-size:26px;font-weight:800;margin:0}
  .res-meta .score span{color:var(--muted);font-size:17px;font-weight:600}
  .res-meta .verdict-txt{color:var(--muted);font-size:14px;margin:6px 0 0}
  .res-meta .res-time{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:8px}
  .res-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 22px}
  @media(max-width:520px){.res-actions{grid-template-columns:1fr}}
  .res-actions .full{grid-column:1/-1}
  .reslist-head{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px}
  .reslist-head .eyebrow{color:var(--muted)}
  .link-btn{background:none;border:none;color:var(--primary);font-family:var(--mono);font-size:12px;cursor:pointer;padding:4px}
  details.ritem{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:9px;overflow:hidden}
  details.ritem[open]{border-color:var(--border-strong)}
  details.ritem>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:11px}
  details.ritem>summary::-webkit-details-marker{display:none}
  .rmark{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px}
  .rmark.ok{background:var(--ok-dim);color:var(--ok);border:1px solid var(--ok-bd)}
  .rmark.bad{background:var(--bad-dim);color:var(--bad);border:1px solid var(--bad-bd)}
  .rinfo{min-width:0;flex:1}
  .rinfo .rt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rinfo .rs{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
  .rinfo .rs b.bad{color:var(--bad)} .rinfo .rs b.ok{color:var(--ok)}
  .rchev{color:var(--faint);font-family:var(--mono);transition:.2s}
  details.ritem[open] .rchev{transform:rotate(90deg);color:var(--primary)}

  /* ---------- ANALYSIS ---------- */
  .ana-head{padding:24px;margin:22px 0 16px}
  .ana-head .eyebrow{margin-bottom:6px}
  .ana-head h2{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.3px}
  .ana-head p{margin:0;color:var(--muted);font-size:14px}
  .prio{margin:14px 0 22px;border:1px solid var(--flag);background:var(--flag-dim);border-radius:var(--r);padding:16px}
  .prio .eyebrow{color:var(--flag)} .prio h3{margin:6px 0 8px;font-size:16px}
  .prio p{margin:0;font-size:14px;color:var(--text)}
  .bars{display:flex;flex-direction:column;gap:14px}
  .bar{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:14px 16px}
  .bar .bt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
  .bar .bt .nm{font-size:14.5px;font-weight:700}
  .bar .bt .fr{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
  .track{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
  .track i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
  .bar.lv-ok i{background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 60%,var(--primary)))}
  .bar.lv-mid i{background:linear-gradient(90deg,var(--flag),#f3a23a)}
  .bar.lv-bad i{background:linear-gradient(90deg,var(--bad),#f0506e)}
  .bar.lv-na i{background:var(--faint);opacity:.4}
  .bar .advice{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}
  .bar.lv-bad{border-color:var(--bad-bd)} .bar.lv-mid{border-color:color-mix(in srgb,var(--flag) 50%, var(--border))}
  .ana-note{font-size:12.5px;color:var(--faint);margin:16px 2px;line-height:1.6}
  .ana-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  @media(max-width:520px){.ana-actions{grid-template-columns:1fr}}

  footer.foot{max-width:780px;margin:30px auto 0;padding:18px;border-top:1px solid var(--border);
    color:var(--faint);font-size:11.5px;line-height:1.7}
  footer.foot b{color:var(--muted);font-weight:600}

  .seg{display:flex;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;margin-top:4px}
  .seg button{flex:1;appearance:none;border:none;background:transparent;color:var(--muted);font-family:var(--mono);font-weight:700;font-size:16px;padding:13px 8px;border-radius:8px;cursor:pointer;transition:.15s}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 92%,#fff),var(--primary));color:var(--primary-ink)}
  .seg button small{font-family:var(--sans);font-weight:600;font-size:11px;opacity:.85;margin-left:3px}
  .poolnote{font-family:var(--mono);font-size:11.5px;color:var(--faint);text-align:center;margin-top:11px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo"></div>
      <div style="min-width:0">
        <b>Web脆弱性診断 模擬試験</b>
        <span>SECURIST PREP · ランダム出題</span>
      </div>
    </div>
    <div class="spacer"></div>
    <div id="modeTag" class="mode-tag" style="display:none"></div>
    <button class="icon-btn" id="themeBtn" title="表示テーマ切替" aria-label="表示テーマ切替">◐</button>
  </div>
</header>
<div class="scan"><i id="scanBar"></i></div>

<main class="wrap" id="app"></main>

/* ============================== DEV QUALITY CHECK (console only) ============================== */
function validateQuestions(){
  try{
    var L=['A','B','C','D'];
    var dist={A:0,B:0,C:0,D:0};
    var issues=[];
    QUESTIONS.forEach(function(q){
      var id=q.id||'?';
      if(L.indexOf(q.answer)<0){ issues.push(id+': answer not A-D'); } else { dist[q.answer]++; }
      if(!q.opts || L.some(function(x){return typeof q.opts[x]!=='string' || !q.opts[x];})){ issues.push(id+': missing/empty option'); }
      if(q.why){
        var wk=Object.keys(q.why).sort().join('');
        var ex=L.filter(function(x){return x!==q.answer;}).sort().join('');
        if(wk!==ex){ issues.push(id+': why keys ['+wk+'] expected ['+ex+']'); }
      } else { issues.push(id+': no why'); }
      if(q.opts){
        var lens=L.map(function(x){return (q.opts[x]||'').length;});
        var mx=Math.max.apply(null,lens), mn=Math.min.apply(null,lens);
        var al=(q.opts[q.answer]||'').length;
        var oth=L.filter(function(x){return x!==q.answer;}).map(function(x){return (q.opts[x]||'').length;});
        var avg=oth.reduce(function(a,b){return a+b;},0)/oth.length;
        if(avg>0 && al>avg*1.5){ issues.push(id+': answer >1.5x avg ('+al+' vs '+Math.round(avg)+')'); }
        if(mn>0 && mx>mn*2){ issues.push(id+': option length spread '+mn+'..'+mx); }
      }
      var blob=(q.q||'')+L.map(function(x){return q.opts?(q.opts[x]||''):'';}).join('');
      if((blob.split('`').length-1)%2!==0){ issues.push(id+': odd backtick count'); }
      var isNeg=(q.type==='誤っているものを選べ');
      if(isNeg!==!!q.negative){ issues.push(id+': negative/type mismatch'); }
      if(isNeg && (q.q||'').indexOf('誤')<0){ issues.push(id+': negative wording missing'); }
      if(['http_basics','cause','method','payload','countermeasure','terminology','misread'].indexOf(q.weakness)<0){ issues.push(id+': bad weakness'); }
    });
    if(typeof console!=='undefined'){
      console.log('[validateQuestions] total='+QUESTIONS.length+' answerDist A:'+dist.A+' B:'+dist.B+' C:'+dist.C+' D:'+dist.D);
      if(issues.length){ console.warn('[validateQuestions] '+issues.length+' issue(s):'); issues.forEach(function(m){console.warn('  - '+m);}); }
      else { console.log('[validateQuestions] OK: no structural issues'); }
    }
  }catch(e){ if(typeof console!=='undefined') console.warn('[validateQuestions] crashed', e); }
}

function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rich(s){var p=String(s).split('`');var o='';for(var i=0;i<p.length;i++){o+= (i%2)?('<code>'+esc(p[i])+'</code>'):esc(p[i]);}return o;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function activeQuestions(){return S.pool?S.pool:QUESTIONS;}
function curQ(){return activeQuestions()[S.order[S.current]];}
function optLetters(q){
  if(!S.optMap[q.id]){
    var base=LETTERS.slice();
    S.optMap[q.id]= S.shuffleA? shuffle(base):base;
  }
  return S.optMap[q.id];
}
/* 選択肢を「表示順」のオブジェクト配列として組み立てる。
   shuffle後もこの単位（optionId）で本文・正誤・誤答理由を一括保持し、
   表示ラベルA〜Dは並び順に応じて付与する。 */
function buildOptions(q){
  var il=optLetters(q);            // 元キー（optionId）の表示順
  var arr=[];
  for(var i=0;i<il.length;i++){
    var id=il[i];
    arr.push({
      optionId:id,                 // 元の選択肢キー（安定ID）
      label:LETTERS[i],            // 画面表示ラベル A〜D（並び順依存）
      text:q.opts[id],             // 選択肢本文
      isCorrect:id===q.answer,     // 正誤情報
      wrongReason:(q.why&&q.why.hasOwnProperty(id))?q.why[id]:'' // 誤答理由
    });
  }
  return arr;
}
/* optionId（元キー）→ 現在の表示ラベル A〜D */
function labelOf(q,optionId){
  if(optionId==null) return '';
  var il=optLetters(q);
  for(var i=0;i<il.length;i++){ if(il[i]===optionId) return LETTERS[i]; }
  return '';
}
/* 解説文中の固定選択肢ラベル（A/B/C/D）をシャッフル後の表示ラベルへ単一パスで置換。
   origToDisp: 元キー→現在表示ラベルのマップ。例: {A:'C', B:'A', C:'D', D:'B'}
   対象パターン：選択肢X / 誤りはX・正解はX / A・B・C型 / Xは誤り・Xが正しい等 */
function dynamicizeExp(text, origToDisp){
  if(!text) return text;
  return text.replace(
    /選択肢([ABCD])|(誤りは|正解は)([ABCD])|([ABCD])((?:・[ABCD])+)|([ABCD])([はが](?:誤り|正しい|正解|不正確|不適切))/g,
    function(){
      var l1=arguments[1], pre=arguments[2], l2=arguments[3],
          first=arguments[4], rest=arguments[5], l3=arguments[6], suf=arguments[7];
      if(l1!==undefined) return '選択肢'+(origToDisp[l1]||l1);
      if(pre!==undefined) return pre+(origToDisp[l2]||l2);
      if(first!==undefined){
        var letters=[first].concat(rest.slice(1).split('・'));
        return letters.map(function(l){ return origToDisp[l]||l; }).join('・');
      }
      if(l3!==undefined) return (origToDisp[l3]||l3)+suf;
      return arguments[0];
    }
  );
}

function countBtn(n){

function modeCard(val,title,desc){

function switchRow(key,label,desc){

function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}
function sample(arr,k){var idx=shuffle(range(arr.length)).slice(0,Math.min(k,arr.length));return idx.map(function(i){return arr[i];});}
function startExam(){beginQuiz(sample(QUESTIONS,S.count));}
function beginQuiz(pool){
  S.pool=pool;
  S.order=range(pool.length);
  S.current=0;S.answers={};S.revealed={};S.optMap={};
  S.start=Date.now();S.end=0;
  S.screen='quiz';
  render();
}

/* ============================== QUIZ ============================== */
function renderQuiz(){
  var qs=activeQuestions();
  var q=curQ();
  var total=S.order.length;
  var opts=buildOptions(q);
  var sel=S.answers[q.id];
  var revealed=S.mode==='study' && S.revealed[q.id];

  modeTag.style.display='';
  modeTag.textContent=S.mode==='test'?'テスト形式':'学習モード';
  scanBar.style.width=Math.round(((S.current)/total)*100)+'%';

  var answeredCount=0;for(var k in S.answers){if(S.answers.hasOwnProperty(k))answeredCount++;}

  var chipCls=q.negative?'neg':'pos';
  var html=
  '<div class="qcount"><span><b>第 '+(S.current+1)+' 問</b> / '+total+'</span>'+
    '<span class="qtimer" id="qtimer">00:00</span></div>'+

  '<div class="panel card">'+
    '<div class="qhead">'+
      '<span class="qtopic">'+esc(q.topic)+'</span>'+
      '<span style="flex:1"></span>'+
      '<span class="chip '+chipCls+'">'+esc(q.type)+'</span>'+
    '</div>'+
    '<div class="qbody"><p class="qtext">'+rich(q.q)+'</p></div>'+
    '<div class="answers" id="answers">';

  for(var i=0;i<opts.length;i++){
    var o=opts[i];                      // 表示順の選択肢オブジェクト
    var cls='ans';
    var verdict='';
    if(revealed){
      cls+=' locked';
      if(o.isCorrect){cls+=' correct';verdict='<span class="verdict">正解</span>';}
      else if(o.optionId===sel){cls+=' wrong';verdict='<span class="verdict">あなたの解答</span>';}
    }else if(o.optionId===sel){cls+=' sel';}
    html+='<button class="'+cls+'" data-letter="'+o.optionId+'">'+
            '<span class="lt">'+o.label+'</span>'+
            '<span class="atext">'+rich(o.text)+'</span>'+verdict+
          '</button>';
  }
  html+='</div>';

  if(revealed){ html+= explanationBlock(q, sel); }
  html+='</div>';

  // palette
  html+='<div class="palette" id="palette">';
  for(var p=0;p<total;p++){
    var pq=qs[S.order[p]];
    var pcls='pdot';
    if(p===S.current)pcls+=' current';
    if(S.answers.hasOwnProperty(pq.id)){
      pcls+=' answered';
      if(S.mode==='study'&&S.revealed[pq.id]){pcls+= (S.answers[pq.id]===pq.answer)?' pcorrect':' pwrong';}
    }
    html+='<button class="'+pcls+'" data-jump="'+p+'">'+(p+1)+'</button>';
  }
  html+='</div>';

  // bottom controls
  html+='<div class="navbar">';
  html+='<button class="btn btn-ghost" id="prevBtn"'+(S.current===0?' disabled':'')+'>← 前へ</button>';
  if(S.mode==='study'){
    if(revealed){
      if(S.current<total-1) html+='<button class="btn btn-primary" id="nextBtn">次へ →</button>';
      else html+='<button class="btn btn-primary" id="finishBtn">結果を見る →</button>';
    }else{
      html+='<button class="btn" id="nextBtn" disabled>選択してください</button>';
    }
  }else{
    html+='<button class="btn btn-ghost" id="nextBtn"'+(S.current===total-1?' disabled':'')+'>次へ →</button>';
  }
  html+='</div>';

  if(S.mode==='test'){
    html+='<div class="submit-wrap"><button class="btn btn-primary" id="submitBtn">採点する（'+answeredCount+'/'+total+'）</button>';
    if(answeredCount<total) html+='<div class="unanswered">未回答 '+(total-answeredCount)+' 問（採点すると不正解扱い）</div>';
    html+='</div>';
  }
  if(S.mode==='study' && !revealed){
    html+='<div class="hint-pick">選択肢をタップすると正誤と解説が表示されます</div>';
  }

  app.innerHTML=html;
  wireQuiz();
  startTimerTick();
}

function explanationBlock(q, sel){
  var correct = sel===q.answer;
  var vcls = correct?'ok':'bad';
  var vtxt = correct?'正解':(sel?'不正解':'未回答');
  var opts=buildOptions(q);            // 表示順の選択肢オブジェクト
  var ansLabel='';
  var origToDisp={};
  for(var i=0;i<opts.length;i++){
    origToDisp[opts[i].optionId]=opts[i].label;
    if(opts[i].isCorrect){ansLabel=opts[i].label;}
  }
  // 解説文中の固定ラベルをシャッフル後の表示ラベルに動的置換
  var expText=dynamicizeExp(q.exp, origToDisp);

  var h='<div class="exp">'+
    '<div class="verline '+vcls+'">'+(correct?'✓ ':'✗ ')+vtxt+' ／ 正答は '+ansLabel+'</div>'+
    '<h4>解説</h4><p>'+rich(expText)+'</p>'+
    '<h4>誤答の理由</h4>';
  // 誤答理由は「表示中のA〜D」の並び順で出力し、各行に表示ラベルを付与する
  for(var j=0;j<opts.length;j++){
    var o=opts[j];
    if(o.isCorrect || !o.wrongReason) continue;
    h+='<div class="why" data-l="'+o.label+'.">'+rich(o.wrongReason)+'</div>';
  }
  h+='<h4>関連用語</h4><div class="terms">';
  q.terms.split(',').forEach(function(t){t=t.trim();if(t)h+='<span class="term">'+esc(t)+'</span>';});
  h+='</div>';
  h+='<h4>復習ポイント</h4><div class="review">'+rich(q.review)+'</div>';
  h+='<div style="margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--faint)">分類: '+esc(WEAK[q.weakness].label)+'</div>';
  h+='</div>';
  return h;
}

function wireQuiz(){
  document.querySelectorAll('.ans[data-letter]').forEach(function(b){
    b.onclick=function(){selectAnswer(b.getAttribute('data-letter'));};
  });
  document.querySelectorAll('.pdot[data-jump]').forEach(function(b){
    b.onclick=function(){S.current=parseInt(b.getAttribute('data-jump'),10);render();};
  });
  var prev=document.getElementById('prevBtn'); if(prev)prev.onclick=function(){if(S.current>0){S.current--;render();}};
  var next=document.getElementById('nextBtn'); if(next&&!next.disabled)next.onclick=function(){if(S.current<S.order.length-1){S.current++;render();}};
  var fin=document.getElementById('finishBtn'); if(fin)fin.onclick=submitQuiz;
  var sub=document.getElementById('submitBtn'); if(sub)sub.onclick=submitQuiz;
}

function selectAnswer(L){
  var q=curQ();
  if(S.mode==='study' && S.revealed[q.id]) return; // locked
  S.answers[q.id]=L;
  if(S.mode==='study') S.revealed[q.id]=true;
  render();
}

function submitQuiz(){ S.end=Date.now(); S.screen='result'; render(); }

/* timer */
var timerInt=null;

  if(timerInt) clearInterval(timerInt);

    var m=Math.floor(s/60); var ss=s%60;

/* ============================== RESULT ============================== */
function computeResults(){
  var qs=activeQuestions();
  var rows=[]; var correct=0;
  for(var i=0;i<S.order.length;i++){
    var q=qs[S.order[i]];
    var sel=S.answers[q.id]||null;
    var ok = sel===q.answer;
    if(ok)correct++;
    rows.push({q:q,sel:sel,ok:ok});
  }
  return {rows:rows, correct:correct, total:S.order.length};
}

  if(timerInt){clearInterval(timerInt);timerInt=null;}
  var R=computeResults();

  var html=

      '<svg width="128" height="128" viewBox="0 0 128 128">'+

        '<circle id="ringFg" cx="64" cy="64" r="54" fill="none" stroke="'+ringColor+'" stroke-width="11" stroke-linecap="round" '+
          'stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+circ.toFixed(1)+'"/>'+
      '</svg>'+
      '<div class="pct"><b style="color:'+ringColor+'">'+pct+'%</b><small>正答率</small></div>'+
    '</div>'+
    '<div class="res-meta">'+
      '<h2>採点結果</h2>'+
      '<p class="score">'+R.correct+' <span>/ '+R.total+' 問正解</span></p>'+
      '<p class="verdict-txt" style="color:'+vcolor+'">'+esc(verdict)+'</p>'+
      '<p class="res-time">所要時間 '+timeStr+' ・ モード: '+(S.mode==='test'?'テスト形式':'学習モード')+'</p>'+
    '</div>'+
  '</div>'+

  '<div class="res-actions">'+
    '<button class="btn btn-primary full" id="anaBtn">弱点分析を見る →</button>'+
    '<button class="btn" id="retryBtn">最初からやり直す</button>'+
    '<button class="btn" id="reviewBtn"'+(wrongCount===0?' disabled':'')+'>間違いだけ復習（'+wrongCount+'問）</button>'+
  '</div>'+

  '<div class="reslist-head"><span class="eyebrow">問題別の結果</span>'+
    '<button class="link-btn" id="toggleAll">全解説を展開 ▾</button></div>';

  var idxLabel={};
  for(var i=0;i<R.rows.length;i++){
    var r=R.rows[i]; var q=r.q;
    var selLabel=r.sel?labelOf(q,r.sel):'—';
    var ansLabel=labelOf(q,q.answer);
    html+=
    '<details class="ritem">'+
      '<summary>'+
        '<span class="rmark '+(r.ok?'ok':'bad')+'">'+(r.ok?'✓':'✗')+'</span>'+
        '<span class="rinfo">'+
          '<span class="rt">'+(i+1)+'. '+esc(q.topic)+'</span>'+
          '<span class="rs">あなた: <b class="'+(r.ok?'ok':'bad')+'">'+selLabel+'</b> ／ 正答: <b class="ok">'+ansLabel+'</b> · '+esc(WEAK[q.weakness].label)+'</span>'+
        '</span>'+
        '<span class="rchev">▸</span>'+

function resultOptions(q, sel){
  var opts=buildOptions(q);            // 表示順の選択肢オブジェクト
  var h='<div class="answers" style="padding-top:14px">';
  for(var i=0;i<opts.length;i++){
    var o=opts[i]; var cls='ans locked'; var v='';
    if(o.isCorrect){cls+=' correct';v='<span class="verdict">正解</span>';}
    else if(o.optionId===sel){cls+=' wrong';v='<span class="verdict">あなたの解答</span>';}
    h+='<div class="'+cls+'"><span class="lt">'+o.label+'</span><span class="atext">'+rich(o.text)+'</span>'+v+'</div>';
  }
  h+='</div>';
  return h;
}

/* ============================== ANALYSIS ============================== */
function renderAnalysis(){
  var R=computeResults();

  // content partition (6 categories, each wrong/answered question counted once)
  var stat={}; for(var key in WEAK){if(key!=='misread')stat[key]={total:0,wrong:0};}
  var negTotal=0, negWrong=0;
  R.rows.forEach(function(r){
    var w=r.q.weakness;
    stat[w].total++; if(!r.ok)stat[w].wrong++;
    if(r.q.negative){negTotal++; if(!r.ok)negWrong++;}
  });
  stat.misread={total:negTotal,wrong:negWrong};

  // build bar list, weakest first (lowest accuracy among attempted)
  var items=[];
  for(var k in WEAK){
    var st=stat[k];
    var acc = st.total>0? Math.round((st.total-st.wrong)/st.total*100) : null;
    items.push({key:k,label:WEAK[k].label,advice:WEAK[k].advice,total:st.total,wrong:st.wrong,acc:acc});
  }
  items.sort(function(a,b){
    if(a.total===0 && b.total===0) return 0;
    if(a.total===0) return 1;
    if(b.total===0) return -1;
    if(a.acc!==b.acc) return a.acc-b.acc;
    return b.wrong-a.wrong;
  });

  // priority message
  var weak=items.filter(function(i){return i.total>0 && i.acc<100;});
  var prioHtml;
  if(weak.length===0){
    prioHtml='<div class="eyebrow">PRIORITY</div><h3>弱点なし（全問正解の領域）</h3>'+
      '<p>今回は誤答ゼロ。出題範囲を広げる、または選択肢シャッフルで再挑戦し、知識の定着度を確認してください。未出題領域（クリックジャッキング・ファイルアップロード・CRLF・情報漏洩・既知脆弱性・診断前準備）も補強候補です。</p>';
  }else{
    var top=weak.slice(0,2).map(function(i){return i.label.replace(/（.*$/,'')+'（'+ (i.total-i.wrong)+'/'+i.total+'）';}).join(' / ');
    prioHtml='<div class="eyebrow">PRIORITY · 優先補強</div><h3>'+esc(top)+'</h3>'+
      '<p>'+esc(weak[0].advice)+'</p>';
  }

  var html=
  '<div class="panel ana-head">'+
    '<div class="eyebrow">Weakness Analysis · 7分類</div>'+
    '<h2>弱点分析</h2>'+
    '<p>誤答を診断学習の観点で分類しました。上位ほど優先度が高い領域です。正答率 '+Math.round(R.correct/R.total*100)+'%（'+R.correct+'/'+R.total+'）。</p>'+
  '</div>'+
  '<div class="prio">'+prioHtml+'</div>'+
  '<div class="bars">';

  items.forEach(function(it){
    var lv,frac,w;
    if(it.total===0){lv='lv-na';frac='出題なし';w=0;}
    else{
      frac=(it.total-it.wrong)+' / '+it.total+' 正解 · '+it.acc+'%';
      w=it.acc;
      lv = it.acc===100?'lv-ok':(it.acc>=50?'lv-mid':'lv-bad');
    }
    html+='<div class="bar '+lv+'">'+
      '<div class="bt"><span class="nm">'+esc(it.label)+'</span><span class="fr">'+frac+'</span></div>'+
      '<div class="track"><i style="width:'+w+'%"></i></div>';
    if(it.total>0 && it.acc<100){ html+='<div class="advice">'+esc(it.advice)+'</div>'; }
    html+='</div>';
  });
  html+='</div>';

  html+='<div class="ana-note">※「問題文の読み落とし（極性トラップ）」は内容分類とは別軸で、「誤っているものを選べ」型の設問（今回 '+negTotal+' 問）のみを集計しています。他の6分類は誤答が1つの主分類にのみ計上される partition です。</div>';

  html+='<div class="ana-actions">'+
    '<button class="btn" id="backBtn">← 結果に戻る</button>'+
    '<button class="btn btn-primary" id="homeBtn">最初からやり直す</button>'+
  '</div>';

  app.innerHTML=html;
  document.getElementById('backBtn').onclick=function(){S.screen='result';render();};
  document.getElementById('homeBtn').onclick=function(){S.screen='start';S.pool=null;render();};

  // animate bars
  var fills=app.querySelectorAll('.track i');
  fills.forEach(function(f){var w=f.style.width;f.style.width='0';setTimeout(function(){f.style.width=w;},60);});
}

/* ============================== KEYBOARD ============================== */
document.addEventListener('keydown',function(e){
  if(S.screen!=='quiz') return;
  var tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  var key=e.key.toUpperCase();
  // A-D or 1-4 select
  var map={'A':0,'B':1,'C':2,'D':3,'1':0,'2':1,'3':2,'4':3};
  if(map.hasOwnProperty(key)){
    var q=curQ(); var il=optLetters(q);
    var L=il[map[key]];
    if(L){selectAnswer(L);e.preventDefault();}
  }else if(e.key==='ArrowRight'){
    if(S.current<S.order.length-1){S.current++;render();}
    e.preventDefault();
  }else if(e.key==='ArrowLeft'){
    if(S.current>0){S.current--;render();}
    e.preventDefault();
  }else if(e.key==='Enter'){
    var nb=document.getElementById('nextBtn');
    var fb=document.getElementById('finishBtn');
    if(fb){fb.click();} else if(nb&&!nb.disabled){nb.click();}
    e.preventDefault();
  }
});

/* ============================== BOOT ============================== */
try{validateQuestions();}catch(e){}
render();
</script>
</body>
</html>
